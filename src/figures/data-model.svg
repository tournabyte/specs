n role (indicates ownership)</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="201" id="ent0056"><path d="M1394.53,605.33 L1394.53,630.6405 A0,0 0 0 0 1394.53,630.6405 L2088.5783,630.6405 A0,0 0 0 0 2088.5783,630.6405 L2088.5783,615.33 L2078.5783,605.33 L1721.78,605.33 L1350.27,420.11 L1713.78,605.33 L1394.53,605.33 A0,0 0 0 0 1394.53,605.33" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2078.5783,605.33 L2078.5783,615.33 L2088.5783,615.33 L2078.5783,605.33" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="673.0483" x="1400.53" y="622.8984">The `team` and `player` fields exists mutually exclusive of each other to determine the membership type</text></g><g class="entity" data-qualified-name="GMN58" data-source-line="205" id="ent0059"><path d="M627.99,765.74 L627.99,867.6033 L1067.1292,867.6033 L1067.1292,775.74 L1057.1292,765.74 L627.99,765.74" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1057.1292,765.74 L1057.1292,775.74 L1067.1292,775.74 L1057.1292,765.74" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.7437" x="633.99" y="783.3084">Role bits determine level of access</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.4585" x="642.2166" y="798.6189">- 1st: captain</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.8818" x="642.2166" y="813.9295">- 2nd: coach</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.0566" x="642.2166" y="829.24">- 3rd: player</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.2314" x="642.2166" y="844.5505">- 4th: bench</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="418.1392" x="633.99" y="859.8611">Only one member may have the caption role (indicates leadership)</text></g><g class="entity" data-qualified-name="GMN61" data-source-line="214" id="ent0062"><path d="M3121.18,597.67 L3121.18,638.2911 A0,0 0 0 0 3121.18,638.2911 L3707.9403,638.2911 A0,0 0 0 0 3707.9403,638.2911 L3707.9403,607.67 L3697.9403,597.67 L3450.56,597.67 L3643.28,476.63 L3442.56,597.67 L3121.18,597.67 A0,0 0 0 0 3121.18,597.67" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3697.9403,597.67 L3697.9403,607.67 L3707.9403,607.67 L3697.9403,597.67" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.0918" x="3127.18" y="615.2384">Participating members list must be unique (no duplicates)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="565.7603" x="3127.18" y="630.5489">If teams are the participants, uniqueness must be maintained accross all team's members</text></g><g class="entity" data-qualified-name="GMN64" data-source-line="219" id="ent0065"><path d="M4107.67,325.38 L4107.67,349.35 L4072.93,353.35 L4107.67,357.35 L4107.67,381.3116 A0,0 0 0 0 4107.67,381.3116 L4699.4576,381.3116 A0,0 0 0 0 4699.4576,381.3116 L4699.4576,335.38 L4689.4576,325.38 L4107.67,325.38 A0,0 0 0 0 4107.67,325.38" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M4689.4576,325.38 L4689.4576,335.38 L4699.4576,335.38 L4689.4576,325.38" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="570.7876" x="4113.67" y="342.9484">The `matches` field represents an adjacency list of the matches that are part of this event</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="565.9126" x="4113.67" y="358.2589">This adjacency list will be useful in generated bracket visuals and tracking event progress</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="501.5981" x="4113.67" y="373.5695">The keys of the adjacency list are the full collection of matches part of an event</text></g><g class="entity" data-qualified-name="GMN67" data-source-line="225" id="ent0068"><path d="M3743.27,597.67 L3743.27,638.2911 A0,0 0 0 0 3743.27,638.2911 L3857.98,638.2911 L3594.53,775.73 L3865.98,638.2911 L4057.8554,638.2911 A0,0 0 0 0 4057.8554,638.2911 L4057.8554,607.67 L4047.8554,597.67 L3743.27,597.67 A0,0 0 0 0 3743.27,597.67" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M4047.8554,597.67 L4047.8554,607.67 L4057.8554,607.67 L4047.8554,597.67" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.5854" x="3749.27" y="615.2384">Participating members should be of same type</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.6577" x="3749.27" y="630.5489">Both are teams or both are individual players</text></g><!--reverse link ACCOUNT to SESSION--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="157" id="lnk22"><path codeLine="157" d="M263.6943,424.1401 C238.8843,467.5801 209.48,519.08 185.72,560.68" fill="none" id="ACCOUNT-backto-SESSION" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="266.67,418.93,258.7331,424.7614,264.1903,423.2718,265.6799,428.729,266.67,418.93" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.2202" x="242.6125" y="439.4282">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.4468" x="172.6915" y="550.369">..5</text